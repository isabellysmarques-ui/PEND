<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto</title>
</head>

<body>

    <h1 id="titulo">Cadastro de Produto</h1>

    <input id="nome" type="text" placeholder="Nome do produto">

    <input id="preco" type="number" placeholder="Preço" step="0.01">

    <input id="categoria" type="text" placeholder="Categoria">

    <input id="desconto" type="number" placeholder="Desconto (%)">

    <button id="botaoCadastrar">
        Cadastrar
    </button>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>

</html>
