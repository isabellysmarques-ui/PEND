<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Fashion Store</h1>
            <p>Loja de Roupas</p>
    </header>
    <main>

        <section class="produtos">

            <h2>Nossos Produtos</h2>
            <div class="lista-produtos">
                <div class="produto">
                    <div class="imagem">👕</div>
                    <h3>Camiseta Básica</h3>
                    <p>R$ 49,90</p>
                    <button>Comprar</button>

                </div>
                <div class="produto">
                    <div class="imagem">👖</div>
                    <h3>Calça Jeans</h3>
                    <p>R$ 119,90</p>
                    <button>Comprar</button>
                </div>
                <div class="produto">
                    <div class="imagem">👗</div>
                    <h3>Vestido</h3>
                    <p>R$ 89,90</p>
                    <button>Comprar</button>
                </div>
            </div>

        </section>
        <section class="entrega">

            <h2>Endereço de Entrega</h2>
            <p class="explicacao">
                Digite seu CEP para consultar seu endereço.
            </p>

            <form id="formulario">

                <label for="cep">CEP:</label>
                <input type="text" id="cep" placeholder="Digite seu CEP" maxlength="9">
                <button type="button" id="buscar">Buscar endereço</button>

                <p id="mensagem"></p>

                <label for="rua">Rua:</label>
                <input type="text" id="rua" readonly>
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" readonly>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" readonly>
                <label for="estado">Estado:</label>
                <input type="text" id="estado" readonly><label for="numero"> Número </label>
                <input type="text" id="numero" placeholder="Número da residência">
                <button class="finalizar" type="submit">Finalizar compra</button>

            </form>
        </section>
    </main>
    <footer>

        <p>
            Fashion Store © 2026<br>
            Consulta de endereço utilizando a API ViaCEP
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
